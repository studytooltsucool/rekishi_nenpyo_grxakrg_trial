<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社会・歴史　年号・時代分け特訓ツール　トライアル（室町時代/安土桃山時代）</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');

:root{
  --paper:#f2ead9;
  --paper-deep:#e8dcc0;
  --ink:#282420;
  --ink-soft:#5a5248;
  --ai:#1f3a5f;
  --ai-deep:#14263f;
  --shu:#bb4430;
  --shu-deep:#8f3222;
  --gold:#b8923a;
  --line:#c9bb98;
  --white:#fffaf0;
  --good:#3f7a4a;
  --good-bg:#eaf5ec;
  --good-line:#6fa578;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  background-image:
    radial-gradient(circle at 15% 8%, rgba(184,146,58,0.10), transparent 40%),
    radial-gradient(circle at 85% 92%, rgba(31,58,95,0.08), transparent 45%);
  color:var(--ink);
  font-family:'Zen Kaku Gothic New', sans-serif;
  min-height:100vh;
  padding:18px 14px 60px;
}
.wrap{max-width:760px;margin:0 auto;}

header.top{text-align:center;padding:18px 10px 22px;position:relative;}
header.top::after{content:"";display:block;width:120px;height:3px;margin:14px auto 0;background:linear-gradient(90deg, transparent, var(--gold), transparent);}
h1{font-family:'Shippori Mincho', serif;font-weight:800;font-size:clamp(24px,6vw,34px);margin:0;color:var(--ai-deep);letter-spacing:.04em;}
.trial-badge{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--white);background:var(--shu);padding:4px 14px;border-radius:999px;}
h1 span{color:var(--shu);}

nav.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:20px;}
nav.tabs button{font-family:'Zen Kaku Gothic New', sans-serif;font-weight:700;font-size:12px;padding:9px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--white);color:var(--ink-soft);cursor:pointer;transition:all .15s ease;}
nav.tabs button:hover{border-color:var(--gold);}
nav.tabs button.active{background:var(--ai-deep);border-color:var(--ai-deep);color:var(--paper);}

.panel{display:none;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:22px 20px 24px;box-shadow:0 2px 0 var(--line), 0 10px 24px -14px rgba(40,36,32,.35);animation:fadeIn .25s ease;}
.panel.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.panel h2{font-family:'Shippori Mincho', serif;font-size:19px;color:var(--ai-deep);margin:0 0 4px;display:flex;align-items:center;gap:8px;}
.panel h2 .num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--shu);color:var(--white);font-size:12px;font-weight:900;font-family:'Zen Kaku Gothic New';flex-shrink:0;}
.panel .desc{font-size:12.5px;color:var(--ink-soft);margin:0 0 18px;line-height:1.6;padding-bottom:14px;border-bottom:1px dashed var(--line);}

.btn{font-family:'Zen Kaku Gothic New';font-weight:700;font-size:13.5px;padding:11px 18px;border-radius:10px;border:none;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--ai-deep);color:var(--paper);}
.btn-primary:hover{box-shadow:0 4px 12px -4px rgba(20,38,63,.5);}
.btn-shu{background:var(--shu);color:var(--white);}
.btn-shu:hover{box-shadow:0 4px 12px -4px rgba(187,68,48,.5);}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink-soft);}
.btn-ghost:hover{border-color:var(--gold);}
.btn-sm{font-size:11.5px;padding:6px 11px;border-radius:7px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-wide{width:100%;text-align:center;}

.setup-view{padding:6px 0 4px;}
.tag-era{display:inline-block;font-size:9.5px;font-weight:700;background:var(--ai);color:var(--white);padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:2px;}

.quiz-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;}
.progress-wrap{flex:1;}
.progress-track{height:7px;border-radius:99px;background:var(--paper-deep);overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg, var(--gold), var(--shu));border-radius:99px;transition:width .3s ease;}
.progress-txt{font-size:11px;color:var(--ink-soft);margin-top:5px;}
.score-pill{flex-shrink:0;background:var(--ai-deep);color:var(--paper);font-weight:800;font-size:12.5px;padding:6px 12px;border-radius:999px;white-space:nowrap;}

.stim-desc{font-size:13.5px;line-height:1.6;color:var(--ink);}

.order-instructions{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;background:var(--paper);padding:8px 12px;border-radius:8px;border:1px dashed var(--line);}
.card-grid{display:grid;gap:10px;margin-bottom:16px;}
.event-card{position:relative;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px 13px 46px;background:var(--paper);cursor:pointer;transition:all .15s ease;}
.event-card:hover{border-color:var(--gold);background:var(--white);}
.event-card .badge{position:absolute;left:10px;top:14px;width:26px;height:26px;border-radius:50%;background:var(--white);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:var(--ink-soft);}
.event-card.picked{border-color:var(--ai-deep);background:#eaf0f7;}
.event-card.picked .badge{background:var(--ai-deep);border-color:var(--ai-deep);color:var(--white);}
.event-card .reveal{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:none;}
.event-card.answered .reveal{display:block;}
.event-card .reveal .yr{font-family:'Shippori Mincho';font-weight:800;color:var(--shu-deep);font-size:12.5px;}
.event-card .reveal .nm{font-weight:700;font-size:12.5px;margin-top:2px;}

.timeline{margin:6px 0 16px;}
.tl-slot{display:flex;align-items:center;gap:8px;padding:6px 0;}
.tl-btn{flex-shrink:0;width:100%;border:1.5px dashed var(--gold);background:#fdf7ea;color:var(--shu-deep);font-weight:700;font-size:12px;padding:9px;border-radius:9px;cursor:pointer;transition:all .15s ease;}
.tl-btn:hover{background:var(--gold);color:var(--white);}
.tl-btn.chosen{background:var(--shu);color:var(--white);border-style:solid;border-color:var(--shu);}
.tl-btn:disabled{cursor:default;}
.tl-item{border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--paper);}
.tl-item .stim-desc{font-size:12.5px;}
.tl-item .reveal{display:none;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);}
.tl-item.answered .reveal{display:block;}
.tl-item .reveal .yr{font-family:'Shippori Mincho';font-weight:800;color:var(--ai-deep);font-size:12px;}
.tl-item .reveal .nm{font-weight:700;font-size:12px;margin-top:1px;}
.target-box{background:linear-gradient(135deg, #fdf7ea, #f7ecd3);border:1.5px solid var(--gold);border-radius:12px;padding:14px 16px;margin-bottom:16px;}
.target-box .lbl{font-size:11px;font-weight:700;color:var(--shu-deep);letter-spacing:.1em;margin-bottom:6px;}
.target-box .reveal{display:none;margin-top:9px;padding-top:9px;border-top:1px dashed var(--gold);}
.target-box.answered .reveal{display:block;}
.target-box .reveal .yr{font-family:'Shippori Mincho';font-weight:900;color:var(--shu-deep);font-size:14px;}
.target-box .reveal .nm{font-weight:800;font-size:13px;margin-top:2px;color:var(--ai-deep);}

.result-box{margin-top:14px;padding:14px 16px;border-radius:12px;font-size:13.5px;line-height:1.7;display:none;}
.result-box.show{display:block;animation:fadeIn .25s ease;}
.result-box.correct{background:var(--good-bg);border:1.5px solid var(--good-line);color:#2c5233;}
.result-box.wrong{background:#fbeceb;border:1.5px solid var(--shu);color:var(--shu-deep);}
.result-box.info{background:#eaf0f7;border:1.5px solid var(--ai);color:var(--ai-deep);}
.result-box .title{font-weight:900;font-size:14.5px;margin-bottom:2px;}

.actions-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}

.result-view{text-align:center;padding:20px 6px 4px;}
.result-big{font-family:'Shippori Mincho';font-weight:900;font-size:52px;color:var(--ai-deep);line-height:1;margin:6px 0;}
.result-big span{font-size:24px;color:var(--ink-soft);font-family:'Zen Kaku Gothic New';}
.result-pct{font-size:14px;font-weight:700;color:var(--shu-deep);margin-bottom:6px;}
.result-msg{font-size:13px;color:var(--ink-soft);margin-bottom:22px;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ai-deep);margin-bottom:5px;}
.field input, .field textarea, .field select{width:100%;font-family:'Zen Kaku Gothic New';font-size:14px;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);}
.field input:focus, .field textarea:focus, .field select:focus{outline:none;border-color:var(--ai-deep);background:var(--white);}
.field textarea{resize:vertical;min-height:64px;font-family:inherit;}
.field .hint{font-size:11px;color:var(--ink-soft);margin-top:4px;}
.save-msg{font-size:12.5px;font-weight:700;color:#2c5233;background:var(--good-bg);border:1.5px solid var(--good-line);padding:9px 12px;border-radius:8px;margin-top:12px;display:none;line-height:1.6;}
.save-msg.show{display:block;animation:fadeIn .25s ease;}
.save-msg.save-msg-warn{color:var(--shu-deep);background:#fbeceb;border-color:var(--shu);}

.list-controls{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.list-controls input{flex:1;min-width:160px;font-family:'Zen Kaku Gothic New';font-size:13.5px;padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);}
.list-controls input:focus{outline:none;border-color:var(--ai-deep);}
.list-controls .btn-sm{flex-shrink:0;}
.add-panel{background:linear-gradient(135deg, #fdf7ea, #f7ecd3);border:1.5px solid var(--gold);border-radius:12px;padding:16px;margin-bottom:16px;}
.add-panel .field{margin-bottom:12px;}
.event-count{font-size:11.5px;color:var(--ink-soft);margin-bottom:10px;}
.list-scroll{max-height:560px;overflow-y:auto;padding-right:4px;}
.list-row{display:flex;align-items:flex-start;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);}
.list-row .yr{flex-shrink:0;width:58px;font-family:'Shippori Mincho';font-weight:800;color:var(--ai-deep);font-size:13px;padding-top:1px;}
.list-row .body{flex:1;min-width:0;}
.list-row .nm{font-weight:700;font-size:13.5px;}
.list-row .ds{font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.5;}
.list-row .row-btns{flex-shrink:0;display:flex;flex-direction:column;gap:5px;}
.tag-user{display:inline-block;font-size:9.5px;font-weight:700;background:var(--shu);color:var(--white);padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:2px;}
.del-btn{flex-shrink:0;background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:15px;padding:2px 4px;line-height:1;}
.del-btn:hover{color:var(--shu);}
.edit-panel{background:var(--paper);border:1.5px solid var(--gold);border-radius:11px;padding:14px;margin:6px 0;width:100%;}
.edit-panel .field{margin-bottom:10px;}
.edit-panel .field label{font-size:11.5px;}
.edit-panel .field input, .edit-panel .field textarea{font-size:13px;padding:8px 10px;}

.loading{text-align:center;padding:40px 0;color:var(--ink-soft);font-size:13px;}
.hidden{display:none !important;}

/* Flashcard */
.flash-controls{display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.quiz-restart-row{display:flex;justify-content:flex-end;margin-bottom:10px;}
.flash-progress{text-align:center;font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
.flash-card{
  min-height:220px;
  border:1.5px solid var(--gold);
  border-radius:16px;
  background:linear-gradient(135deg, #fdf7ea, #f7ecd3);
  padding:26px 22px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  cursor:pointer;
  box-shadow:0 3px 0 var(--gold), 0 12px 24px -16px rgba(40,36,32,.4);
}
.flash-face{width:100%;}
.flash-front .fname{font-family:'Shippori Mincho';font-weight:800;font-size:20px;color:var(--ai-deep);line-height:1.5;}
.flash-front .ftap{margin-top:14px;font-size:11.5px;color:var(--ink-soft);}
.flash-back .byr{font-family:'Shippori Mincho';font-weight:900;font-size:24px;color:var(--shu-deep);}
.flash-back .bnm{font-weight:800;font-size:16px;color:var(--ai-deep);margin-top:6px;}
.flash-back .bds{font-size:12.5px;color:var(--ink-soft);margin-top:10px;line-height:1.6;}
.flash-nav{justify-content:center;margin-top:16px;}

</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <h1>社会・歴史　<span>年号・時代分け</span>特訓ツール</h1>
  <div class="trial-badge">トライアル版（室町時代 / 安土桃山時代）</div>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="flash">🗂 フラッシュカード</button>
  <button class="tab-btn" data-tab="order">① 並べかえ</button>
  <button class="tab-btn" data-tab="position">② 位置あて</button>
</nav>

<!-- FLASHCARD -->
<section class="panel active" id="panel-flash">
  <h2><span class="num">🗂</span>フラッシュカード</h2>
  <p class="desc">スコアなしの気軽な暗記モードです。カードをタップすると裏返り、年号・名前・詳しい説明が確認できます。</p>

  <div class="flash-controls">
    <button class="btn btn-ghost btn-sm" id="flash-shuffle">🔀 シャッフルして最初から</button>
  </div>

  <div id="flash-area">
    <div class="flash-progress" id="flash-progress"></div>
    <div class="flash-card" id="flash-card">
      <div class="flash-face flash-front" id="flash-front"></div>
      <div class="flash-face flash-back hidden" id="flash-back"></div>
    </div>
    <div class="actions-row flash-nav">
      <button class="btn btn-ghost" id="flash-prev">← 前へ</button>
      <button class="btn btn-shu" id="flash-flip">カードをめくる</button>
      <button class="btn btn-ghost" id="flash-next">次へ →</button>
    </div>
  </div>
</section>

<!-- MODE 1: ORDERING -->
<section class="panel" id="panel-order">
  <h2><span class="num">1</span>4つの出来事を年代順に</h2>
  <p class="desc">出来事の「説明文」だけを読んで、起きた順（古い→新しい）に並べかえよう。名前や年号は表示されません。全3問。</p>

  <div class="setup-view" id="order-setup">
    <button class="btn btn-shu btn-wide" id="order-start">スタートする</button>
  </div>

  <div class="hidden" id="order-quiz">
    <div class="quiz-restart-row">
      <button class="btn btn-ghost btn-sm" id="order-quiz-restart">⏪ 最初からやり直す</button>
    </div>
    <div class="quiz-head">
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="order-progress-fill"></div></div>
        <div class="progress-txt" id="order-progress-txt"></div>
      </div>
      <div class="score-pill" id="order-score-pill"></div>
    </div>
    <div class="order-instructions">💡 古いと思う出来事から順にカードをタップしてください（1→2→3→4）</div>
    <div class="card-grid" id="order-cards"></div>
    <div class="actions-row">
      <button class="btn btn-primary" id="order-check">答え合わせ</button>
      <button class="btn btn-ghost" id="order-reset">選び直す</button>
      <button class="btn btn-shu hidden" id="order-next">次の問題へ</button>
    </div>
    <div class="result-box" id="order-result"></div>
  </div>

  <div class="hidden" id="order-result-view">
    <div class="result-view">
      <div class="result-big" id="order-final-score">0<span>/3</span></div>
      <div class="result-pct" id="order-final-pct"></div>
      <div class="result-msg" id="order-final-msg"></div>
      <div class="actions-row" style="justify-content:center;">
        <button class="btn btn-shu" id="order-retry-same">もう一度挑戦する</button>
      </div>
    </div>
  </div>
</section>

<!-- MODE 2: POSITION -->
<section class="panel" id="panel-position">
  <h2><span class="num">2</span>この出来事はどこに入る？</h2>
  <p class="desc">「説明文」だけをヒントに、年代順にならんだ出来事の中の正しい位置を当てよう。全3問。</p>

  <div class="setup-view" id="pos-setup">
    <button class="btn btn-shu btn-wide" id="pos-start">スタートする</button>
  </div>

  <div class="hidden" id="pos-quiz">
    <div class="quiz-restart-row">
      <button class="btn btn-ghost btn-sm" id="pos-quiz-restart">⏪ 最初からやり直す</button>
    </div>
    <div class="quiz-head">
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="pos-progress-fill"></div></div>
        <div class="progress-txt" id="pos-progress-txt"></div>
      </div>
      <div class="score-pill" id="pos-score-pill"></div>
    </div>
    <div class="target-box" id="pos-target-box">
      <div class="lbl">この出来事はどこに入る？</div>
      <div class="stim-desc" id="pos-target-desc"></div>
      <div class="reveal" id="pos-target-reveal"></div>
    </div>
    <div class="timeline" id="pos-timeline"></div>
    <div class="actions-row">
      <button class="btn btn-shu hidden" id="pos-next">次の問題へ</button>
    </div>
    <div class="result-box" id="pos-result"></div>
  </div>

  <div class="hidden" id="pos-result-view">
    <div class="result-view">
      <div class="result-big" id="pos-final-score">0<span>/3</span></div>
      <div class="result-pct" id="pos-final-pct"></div>
      <div class="result-msg" id="pos-final-msg"></div>
      <div class="actions-row" style="justify-content:center;">
        <button class="btn btn-shu" id="pos-retry-same">もう一度挑戦する</button>
      </div>
    </div>
  </div>
</section>

</div>

<script>
const SEED_EVENTS = [{"year": "1404年", "name": "日明貿易の開始", "desc": "室町幕府の第3代将軍・足利義満が、明（中国）との間で勘合を用いた正式な貿易を開始した。"}, {"year": "1428年", "name": "正長の土一揆", "desc": "近江国（滋賀県）の馬借（運送業者）らの呼びかけをきっかけに、室町幕府に対して起こった日本史上最初の本格的な土一揆（農民一揆）"}, {"year": "1467年", "name": "応仁の乱", "desc": "将軍の後継争いから細川氏と山名氏が大激突。11年続き、京都が荒廃し戦国時代の幕開けとなった。"}, {"year": "1488年", "name": "加賀の一向一揆", "desc": "加賀国（石川県）で浄土真宗（一向宗）の門徒が結束して挙兵し、対立していた守護大名の富樫政親を討ち取った。その後、約100年間にわたり農民自治を行った。"}, {"year": "1543年", "name": "鉄砲伝来", "desc": "種子島に漂着したポルトガル人によって火縄銃が伝えられた。"}, {"year": "1549年", "name": "キリスト教伝来", "desc": "イエズス会のフランシスコ＝ザビエルが鹿児島に上陸し、キリスト教を布教した。"}, {"year": "1560年", "name": "桶狭間の戦い", "desc": "織田信長が駿河の大名・今川義元を奇襲して討ち取り、全国に名を知らしめた。"}, {"year": "1573年", "name": "室町幕府の滅亡", "desc": "織田信長が第15代将軍の足利義昭を京都から追放し、室町幕府が終わりを迎えた。"}, {"year": "1575年", "name": "長篠の戦い", "desc": "織田信長・徳川家康の連合軍が、鉄砲を組織的に使って武田勝頼の騎馬隊を打ち破った。"}, {"year": "1582年", "name": "本能寺の変", "desc": "天下統一を目前にした織田信長が、家臣の明智光秀に裏切られて京都の本能寺で自害した"}, {"year": "1582年", "name": "太閤検地の開始", "desc": "羽柴秀吉（豊臣秀吉）が、農民の升や単位を統一して年貢の徴収体制を整え、兵農分離へとつながる基盤を築いた。"}, {"year": "1588年", "name": "刀狩令", "desc": "豊臣秀吉が農民から武器を取り上げ、兵農分離を進めて一揆を防ごうとした。"}, {"year": "1590年", "name": "全国統一の完成", "desc": "豊臣秀吉が小田原の北条氏を倒し、応仁の乱以来続いていた戦国時代を終わらせた。"}, {"year": "1592年", "name": "文禄の役", "desc": "天下統一を果たした豊臣秀吉が、明（中国）の征服を目指して朝鮮半島へ大軍を派遣した"}, {"year": "1597年", "name": "慶長の役", "desc": "明（中国）との講和交渉が破談したため、豊臣秀吉が再び朝鮮半島へ約14万人の大軍を再派遣した"}, {"year": "1600年", "name": "関ヶ原の戦い", "desc": "徳川家康（東軍）が石田三成（西軍）らを破り、天下の権力を実質的に握った。"}];
// Trial edition uses its own storage key (distinct from the full version's
// 'nengo:events:v2') so that saved/synced data never collides with the full
// tool — window.storage is not guaranteed to be isolated per published
// artifact, only per key, so sharing a key would leak the full 176-event
// dataset into this trial (and vice versa).
const STORAGE_KEY = 'nengo:events:trial-muromachi-azuchi:v1';
// Bump this whenever SEED_EVENTS is re-embedded with a newer snapshot of the
// timeline. It only affects the browser-local fallback path below (see
// EFFECTIVE_STORAGE_KEY) — it never touches window.storage, so syncing via a
// published Claude artifact + account login is unaffected.
const SEED_BUILD = 'trial-muromachi-azuchi-20260927a';
const TOTAL_Q = 3;

// Fixed spread/step values controlling how close together in time the events
// within one question are (previously tied to a removed difficulty setting).
// The era selector narrows the candidate pool first; these values then decide
// how questions are picked from within that pool.
const ORDER_SPREAD = 6;
const POS_STEP = 1;

let EVENTS = [];

function toHalfWidthDigits(s){
  return String(s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
}
// Detects "N世紀" / "紀元前N世紀" style approximate-year entries.
// Placement rule: an "Nth century" entry is treated as landing at the very end
// of its hundred-year block, e.g. 6世紀ごろ -> 599 (end of the 500s),
// 紀元前3世紀ごろ -> -201 (end / most-recent edge of the 3rd century BC).
function parseCenturyApprox(raw){
  const s = toHalfWidthDigits(raw).trim();
  const m = s.match(/^(紀元前)?\s*(\d+)\s*世紀/);
  if(!m) return null;
  const n = parseInt(m[2], 10);
  if(!n || n < 0) return null;
  const isBC = !!m[1];
  const yearApprox = isBC ? (99 - n*100) : (n*100 - 1);
  const suffixMatch = s.match(/^(?:紀元前)?\s*\d+\s*世紀\s*(.*)$/);
  const suffix = (suffixMatch && suffixMatch[1].trim()) ? suffixMatch[1].trim() : 'ごろ';
  return { isBC, n, yearApprox, label: `${isBC ? '紀元前' : ''}${n}世紀${suffix}` };
}
function parseYear(y){
  const c = parseCenturyApprox(y);
  if(c) return c.yearApprox;
  const m = toHalfWidthDigits(y).match(/-?\d+/);
  return m ? parseInt(m[0], 10) : 0;
}
function normalizeYearLabel(y){
  const c = parseCenturyApprox(y);
  if(c) return c.label;
  let s = toHalfWidthDigits(y).trim();
  if(!s.endsWith('年')) s = s + '年';
  return s;
}
// Chronological Japanese-history periods, each defined by the last year
// (inclusive) it covers. A year is assigned to the first period whose
// "until" it does not exceed. The last period has no upper bound.
// Trial edition covers only these two periods.
const ERAS = [
  { id:'muromachi',      name:'室町時代',     until: 1573 },
  { id:'azuchimomoyama', name:'安土桃山時代', until: Infinity },
];
function eraOf(yearLabel){
  const y = parseYear(yearLabel);
  for(const era of ERAS){ if(y <= era.until) return era; }
  return ERAS[ERAS.length-1];
}
function eventsInEra(eraId){
  return eraId==='all' ? EVENTS : EVENTS.filter(e=>eraOf(e.year).id===eraId);
}
function distinctYearCount(eraId){
  return new Set(eventsInEra(eraId).map(e=>parseYear(e.year))).size;
}
// Renders an "all eras" + 14-era button grid into containerId. Buttons whose
// era doesn't have enough distinct years for the quiz mode (minDistinctYears)
// are shown disabled rather than hidden, so it's clear the era exists but has
// too little data yet. onSelect(eraId) is called when an enabled button is clicked.
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function sortedEvents(){
  return [...EVENTS].sort((a,b)=>parseYear(a.year)-parseYear(b.year));
}

// window.storage is only available while this page runs inside Claude's artifact
// viewer. When the file is downloaded and opened directly in a browser, it does
// not exist, so we fall back to localStorage in that case.
const HAS_CLAUDE_STORAGE = (typeof window.storage !== 'undefined' && window.storage !== null);
const STORAGE_TIMEOUT_MS = 4000;

// When opened inside Claude, window.storage is scoped to this specific
// published artifact + account, so the plain STORAGE_KEY is safe to reuse
// forever (that's how in-app edits keep syncing across devices).
// When downloaded and opened directly in a browser, localStorage is scoped
// to the file:// origin, which is SHARED by every local HTML file ever
// opened in that browser — so data left over from an older copy of this file
// (e.g. an earlier export with fewer events) would otherwise "leak" into a
// newer one and hide the up-to-date SEED_EVENTS. Folding SEED_BUILD into the
// key used for that fallback path means a newer file always starts from its
// own embedded data instead of an older browser-local leftover.
const EFFECTIVE_STORAGE_KEY = HAS_CLAUDE_STORAGE ? STORAGE_KEY : (STORAGE_KEY + ':' + SEED_BUILD);

function withTimeout(promise, ms, fallbackValue){
  return new Promise((resolve)=>{
    let done = false;
    const timer = setTimeout(()=>{ if(!done){ done = true; resolve(fallbackValue); } }, ms);
    promise.then(v=>{ if(!done){ done = true; clearTimeout(timer); resolve(v); } })
           .catch(()=>{ if(!done){ done = true; clearTimeout(timer); resolve(fallbackValue); } });
  });
}

function storageWarningText(){
  return HAS_CLAUDE_STORAGE
    ? '保存領域への書き込みに失敗しました。少し時間をおいてから、もう一度お試しください。'
    : '保存領域への書き込みに失敗しました。ブラウザの設定（プライベートブラウズモードなど）や空き容量をご確認のうえ、もう一度お試しください。';
}

async function storageGetValue(key){
  if(HAS_CLAUDE_STORAGE){
    const res = await withTimeout(window.storage.get(key, false), STORAGE_TIMEOUT_MS, null);
    return (res && res.value) ? res.value : null;
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSetValue(key, value){
  // Always keep a same-tab safety copy first, so data survives even if the
  // Claude storage call hangs or fails silently (e.g. unpublished artifact).
  try{ sessionStorage.setItem(key, value); }catch(e){ /* ignore */ }
  if(HAS_CLAUDE_STORAGE){
    const ok = await withTimeout(
      window.storage.set(key, value, false).then(()=>true),
      STORAGE_TIMEOUT_MS,
      false
    );
    return ok;
  }
  try{ localStorage.setItem(key, value); return true; }
  catch(e){ console.error('保存に失敗しました', e); return false; }
}

async function loadEvents(){
  const raw = await storageGetValue(EFFECTIVE_STORAGE_KEY);
  if(raw){
    try{
      EVENTS = JSON.parse(raw);
      return;
    }catch(e){ /* corrupt, fall through to reseed */ }
  }
  // If Claude storage timed out / has nothing yet, check this tab's safety copy
  // before reseeding, so a page refresh in the same tab never loses data.
  try{
    const sessionRaw = sessionStorage.getItem(EFFECTIVE_STORAGE_KEY);
    if(sessionRaw){
      EVENTS = JSON.parse(sessionRaw);
      return;
    }
  }catch(e){ /* ignore */ }
  EVENTS = SEED_EVENTS.map(e => ({...e, src:'seed'}));
  await saveEvents();
}
async function saveEvents(){
  return await storageSetValue(EFFECTIVE_STORAGE_KEY, JSON.stringify(EVENTS));
}

function groupByYear(all){
  const byYear = new Map();
  all.forEach(e=>{
    const y = parseYear(e.year);
    if(!byYear.has(y)) byYear.set(y, []);
    byYear.get(y).push(e);
  });
  return byYear;
}
function pickRep(events){
  if(events.length===1) return events[0];
  return events[Math.floor(Math.random()*events.length)];
}

// Picks n events with n distinct years (so e.g. two 1945-nen events never appear
// in the same question), biased toward years close together within `spread`.
function pickCloseGroup(n, spread, eraId){
  const all = sortedEvents().filter(e => eraId==='all' || !eraId || eraOf(e.year).id===eraId);
  const byYear = groupByYear(all);
  const distinctYears = [...byYear.keys()].sort((a,b)=>a-b);
  const dLen = distinctYears.length;
  if(dLen <= n){
    return shuffle(distinctYears.map(y=>pickRep(byYear.get(y)))).slice(0, dLen);
  }
  const half = Math.max(Math.floor(spread/2), n-1);
  const anchorIdx = Math.floor(Math.random()*dLen);
  let lo = Math.max(0, anchorIdx-half);
  let hi = Math.min(dLen-1, anchorIdx+half);
  while(hi-lo+1 < n){
    if(lo>0) lo--; else if(hi<dLen-1) hi++; else break;
  }
  const windowYears = distinctYears.slice(lo, hi+1);
  return shuffle(windowYears).slice(0, n).map(y=>pickRep(byYear.get(y)));
}

// Same distinct-year guarantee for the position-quiz's 5-event group.
function pickPositionGroup(step, eraId){
  const all = sortedEvents().filter(e => eraId==='all' || !eraId || eraOf(e.year).id===eraId);
  const byYear = groupByYear(all);
  const distinctYears = [...byYear.keys()].sort((a,b)=>a-b);
  const dLen = distinctYears.length;
  const n = 5;
  if(dLen <= n){
    return distinctYears.map(y=>pickRep(byYear.get(y)));
  }
  const maxStart = dLen - 1 - step*(n-1);
  const start = maxStart>0 ? Math.floor(Math.random()*(maxStart+1)) : 0;
  const idxs = [];
  for(let i=0;i<n;i++){ let idx = start + i*step; if(idx > dLen-1) idx = dLen-1; idxs.push(idx); }
  const uniq = [...new Set(idxs)];
  while(uniq.length < Math.min(n,dLen)){
    const cand = Math.floor(Math.random()*dLen);
    if(!uniq.includes(cand)) uniq.push(cand);
  }
  uniq.sort((a,b)=>a-b);
  return uniq.map(i=> pickRep(byYear.get(distinctYears[i])));
}

function resultMsg(pct){
  if(pct>=90) return 'すばらしい！ほぼ完璧です。';
  if(pct>=70) return 'よくできました。もう少しで満点です。';
  if(pct>=50) return 'まずまず。近い年代の出来事を復習しよう。';
  return '苦手な時代をもう一度見直してみよう。';
}

   MODE 1: ORDERING
===================================================== */
let orderSession = null;
// Trial edition: no era selection — always draws from the full trial dataset
// (室町時代 + 安土桃山時代).
const orderEra = 'all';
function showOrderView(view){
  document.getElementById('order-setup').classList.toggle('hidden', view!=='setup');
  document.getElementById('order-quiz').classList.toggle('hidden', view!=='quiz');
  document.getElementById('order-result-view').classList.toggle('hidden', view!=='result');
}
function startOrderSession(){
  orderSession = { index:0, score:0, usedCombos: new Set(), era: orderEra };
  showOrderView('quiz');
  nextOrderQuestion();
}
async function nextOrderQuestion(){
  if(orderSession.index >= TOTAL_Q){ finishOrderSession(); return; }
  orderSession.index++;
  if(distinctYearCount(orderSession.era) < 4){
    document.getElementById('order-cards').innerHTML = `<div class="loading">出来事が4件未満です。</div>`;
    return;
  }
  let chosen, key;
  for(let attempt=0; attempt<30; attempt++){
    chosen = pickCloseGroup(4, ORDER_SPREAD, orderSession.era);
    key = chosen.map(e=>e.name).sort().join('|');
    if(!orderSession.usedCombos.has(key)) break;
  }
  orderSession.usedCombos.add(key);
  orderSession.picks = [];
  orderSession.answered = false;
  orderSession.pool = shuffle(chosen);
  updateOrderHead();
  document.getElementById('order-result').classList.remove('show','correct','wrong');
  document.getElementById('order-check').classList.remove('hidden');
  document.getElementById('order-reset').classList.remove('hidden');
  document.getElementById('order-next').classList.add('hidden');
  renderOrderCards();
}
function updateOrderHead(){
  const pct = Math.round(((orderSession.index-1)/TOTAL_Q)*100);
  document.getElementById('order-progress-fill').style.width = pct + '%';
  document.getElementById('order-progress-txt').textContent = `問題 ${orderSession.index} / ${TOTAL_Q}`;
  document.getElementById('order-score-pill').textContent = `正解 ${orderSession.score}`;
}
function renderOrderCards(){
  const wrap = document.getElementById('order-cards');
  wrap.innerHTML = '';
  orderSession.pool.forEach((ev, idx)=>{
    const pickIdx = orderSession.picks.indexOf(idx);
    const card = document.createElement('div');
    card.className = 'event-card' + (pickIdx>-1 ? ' picked':'') + (orderSession.answered ? ' answered':'');
    card.innerHTML = `
      <div class="badge">${pickIdx>-1 ? (pickIdx+1) : ''}</div>
      <div class="stim-desc">${escapeHtml(ev.desc || ev.name)}</div>
      <div class="reveal"><div class="yr">${escapeHtml(normalizeYearLabel(ev.year))}</div><div class="nm">${escapeHtml(ev.name)}</div></div>
    `;
    if(!orderSession.answered){
      card.addEventListener('click', ()=>{
        if(orderSession.picks.includes(idx)) orderSession.picks = orderSession.picks.filter(i=>i!==idx);
        else if(orderSession.picks.length < 4) orderSession.picks.push(idx);
        renderOrderCards();
      });
    }
    wrap.appendChild(card);
  });
}
document.getElementById('order-check').addEventListener('click', ()=>{
  if(!orderSession || !orderSession.pool) return;
  if(orderSession.picks.length < 4){
    const box = document.getElementById('order-result');
    box.classList.add('show');
    box.classList.remove('correct');
    box.classList.add('wrong');
    box.innerHTML = `<div class="title">4つすべてタップしてください</div><div>並び順を決めるには4枚すべてを選ぶ必要があります。</div>`;
    return;
  }
  orderSession.answered = true;
  const pool = orderSession.pool;
  const correctOrderIdx = pool.map((e,i)=>i).sort((a,b)=>parseYear(pool[a].year)-parseYear(pool[b].year));
  const isCorrect = JSON.stringify(orderSession.picks) === JSON.stringify(correctOrderIdx);
  if(isCorrect) orderSession.score++;
  renderOrderCards();
  updateOrderHead();
  const box = document.getElementById('order-result');
  box.classList.add('show');
  box.classList.toggle('correct', isCorrect);
  box.classList.toggle('wrong', !isCorrect);
  const correctLine = correctOrderIdx.map(i=>`${normalizeYearLabel(pool[i].year)} ${pool[i].name}`).join('　→　');
  box.innerHTML = `<div class="title">${isCorrect ? '🎉 正解！' : '❌ 不正解'}</div><div>正しい順番：${correctLine}</div>`;
  document.getElementById('order-check').classList.add('hidden');
  document.getElementById('order-reset').classList.add('hidden');
  document.getElementById('order-next').classList.remove('hidden');
});
document.getElementById('order-reset').addEventListener('click', ()=>{
  if(!orderSession || !orderSession.pool) return;
  orderSession.picks = [];
  document.getElementById('order-result').classList.remove('show','correct','wrong');
  renderOrderCards();
});
document.getElementById('order-next').addEventListener('click', nextOrderQuestion);
function finishOrderSession(){
  showOrderView('result');
  const score = orderSession.score, pct = Math.round((score/TOTAL_Q)*100);
  document.getElementById('order-final-score').innerHTML = `${score}<span>/${TOTAL_Q}</span>`;
  document.getElementById('order-final-pct').textContent = `正答率 ${pct}%`;
  document.getElementById('order-final-msg').textContent = resultMsg(pct);
}
document.getElementById('order-start').addEventListener('click', startOrderSession);
document.getElementById('order-retry-same').addEventListener('click', startOrderSession);
document.getElementById('order-quiz-restart').addEventListener('click', ()=>{
  orderSession = null;
  showOrderView('setup');
});

/* =====================================================
   MODE 2: POSITION
===================================================== */
let posSession = null;
// Trial edition: no era selection — always draws from the full trial dataset
// (室町時代 + 安土桃山時代).
const posEra = 'all';
function showPosView(view){
  document.getElementById('pos-setup').classList.toggle('hidden', view!=='setup');
  document.getElementById('pos-quiz').classList.toggle('hidden', view!=='quiz');
  document.getElementById('pos-result-view').classList.toggle('hidden', view!=='result');
}
function startPosSession(){
  posSession = { index:0, score:0, usedTargets: new Set(), era: posEra };
  showPosView('quiz');
  nextPosQuestion();
}
async function nextPosQuestion(){
  if(posSession.index >= TOTAL_Q){ finishPosSession(); return; }
  posSession.index++;
  if(distinctYearCount(posSession.era) < 5){
    document.getElementById('pos-timeline').innerHTML = `<div class="loading">出来事が5件未満です。</div>`;
    return;
  }
  let group, targetPos, target;
  for(let attempt=0; attempt<30; attempt++){
    group = pickPositionGroup(POS_STEP, posSession.era);
    targetPos = Math.floor(Math.random()*group.length);
    target = group[targetPos];
    if(!posSession.usedTargets.has(target)) break;
  }
  posSession.usedTargets.add(target);
  posSession.correctIdx = targetPos;
  posSession.answered = false;
  posSession.target = target;
  posSession.sorted = group.filter((_,i)=>i!==targetPos);
  updatePosHead();
  document.getElementById('pos-result').classList.remove('show','correct','wrong');
  document.getElementById('pos-next').classList.add('hidden');
  const tb = document.getElementById('pos-target-box');
  tb.classList.remove('answered');
  document.getElementById('pos-target-desc').textContent = posSession.target.desc || posSession.target.name;
  document.getElementById('pos-target-reveal').innerHTML = `<div class="yr">${escapeHtml(normalizeYearLabel(posSession.target.year))}</div><div class="nm">${escapeHtml(posSession.target.name)}</div>`;
  renderPositionTimeline();
}
function updatePosHead(){
  const pct = Math.round(((posSession.index-1)/TOTAL_Q)*100);
  document.getElementById('pos-progress-fill').style.width = pct + '%';
  document.getElementById('pos-progress-txt').textContent = `問題 ${posSession.index} / ${TOTAL_Q}`;
  document.getElementById('pos-score-pill').textContent = `正解 ${posSession.score}`;
}
function renderPositionTimeline(){
  const wrap = document.getElementById('pos-timeline');
  wrap.innerHTML = '';
  const addSlot = (slotIdx)=>{
    const slot = document.createElement('div');
    slot.className = 'tl-slot';
    const b = document.createElement('button');
    b.className = 'tl-btn';
    b.textContent = 'ここに入る';
    if(!posSession.answered){ b.addEventListener('click', ()=>checkPosition(slotIdx)); }
    else{ b.disabled = true; if(slotIdx === posSession.correctIdx) b.classList.add('chosen'); }
    slot.appendChild(b);
    wrap.appendChild(slot);
  };
  addSlot(0);
  posSession.sorted.forEach((ev, i)=>{
    const item = document.createElement('div');
    item.className = 'tl-item' + (posSession.answered ? ' answered':'');
    item.innerHTML = `<div class="stim-desc">${escapeHtml(ev.desc || ev.name)}</div><div class="reveal"><div class="yr">${escapeHtml(normalizeYearLabel(ev.year))}</div><div class="nm">${escapeHtml(ev.name)}</div></div>`;
    wrap.appendChild(item);
    addSlot(i+1);
  });
}
function checkPosition(slotIdx){
  posSession.answered = true;
  const isCorrect = slotIdx === posSession.correctIdx;
  if(isCorrect) posSession.score++;
  document.getElementById('pos-target-box').classList.add('answered');
  renderPositionTimeline();
  updatePosHead();
  const box = document.getElementById('pos-result');
  box.classList.add('show');
  box.classList.toggle('correct', isCorrect);
  box.classList.toggle('wrong', !isCorrect);
  box.innerHTML = `<div class="title">${isCorrect ? '🎉 正解！' : '❌ 不正解'}</div><div>「${escapeHtml(posSession.target.name)}」は<strong>${escapeHtml(normalizeYearLabel(posSession.target.year))}</strong>の出来事でした。</div>`;
  document.getElementById('pos-next').classList.remove('hidden');
}
document.getElementById('pos-next').addEventListener('click', nextPosQuestion);
function finishPosSession(){
  showPosView('result');
  const score = posSession.score, pct = Math.round((score/TOTAL_Q)*100);
  document.getElementById('pos-final-score').innerHTML = `${score}<span>/${TOTAL_Q}</span>`;
  document.getElementById('pos-final-pct').textContent = `正答率 ${pct}%`;
  document.getElementById('pos-final-msg').textContent = resultMsg(pct);
}
document.getElementById('pos-start').addEventListener('click', startPosSession);
document.getElementById('pos-retry-same').addEventListener('click', startPosSession);
document.getElementById('pos-quiz-restart').addEventListener('click', ()=>{
  posSession = null;
  showPosView('setup');
});

/* =====================================================
   FLASHCARD (no scoring, casual review)
===================================================== */
let flashDeck = [];
let flashIdx = 0;
let flashFlipped = false;
// Trial edition: no era selection — always draws from the full trial dataset
// (室町時代 + 安土桃山時代).
const flashEra = 'all';

function buildFlashDeck(){
  flashDeck = shuffle(eventsInEra(flashEra));
  flashIdx = 0;
  flashFlipped = false;
}
function renderFlashCard(){
  const area = document.getElementById('flash-area');
  if(flashDeck.length === 0){
    document.getElementById('flash-progress').textContent = '';
    document.getElementById('flash-front').innerHTML = '<div class="loading">表示できるカードがありません。</div>';
    document.getElementById('flash-back').classList.add('hidden');
    document.getElementById('flash-front').classList.remove('hidden');
    return;
  }
  const ev = flashDeck[flashIdx];
  document.getElementById('flash-progress').textContent = `カード ${flashIdx+1} / ${flashDeck.length}`;
  document.getElementById('flash-front').innerHTML = `<div class="fname">${escapeHtml(ev.desc || ev.name)}</div><div class="ftap">タップして年号・名前を確認</div>`;
  document.getElementById('flash-back').innerHTML = `
    <div class="byr">${escapeHtml(normalizeYearLabel(ev.year))}</div>
    <div class="bnm">${escapeHtml(ev.name)}</div>
    ${ev.desc ? `<div class="bds">${escapeHtml(ev.desc)}</div>` : ''}
  `;
  flashFlipped = false;
  document.getElementById('flash-front').classList.remove('hidden');
  document.getElementById('flash-back').classList.add('hidden');
}
function flipFlashCard(){
  if(flashDeck.length === 0) return;
  flashFlipped = !flashFlipped;
  document.getElementById('flash-front').classList.toggle('hidden', flashFlipped);
  document.getElementById('flash-back').classList.toggle('hidden', !flashFlipped);
}
document.getElementById('flash-card').addEventListener('click', flipFlashCard);
document.getElementById('flash-flip').addEventListener('click', flipFlashCard);
document.getElementById('flash-prev').addEventListener('click', ()=>{
  if(flashDeck.length === 0) return;
  flashIdx = (flashIdx - 1 + flashDeck.length) % flashDeck.length;
  renderFlashCard();
});
document.getElementById('flash-next').addEventListener('click', ()=>{
  if(flashDeck.length === 0) return;
  flashIdx = (flashIdx + 1) % flashDeck.length;
  renderFlashCard();
});
document.getElementById('flash-shuffle').addEventListener('click', ()=>{
  buildFlashDeck();
  renderFlashCard();
});

/* =====================================================
   INIT
===================================================== */
(async function init(){
  await loadEvents();
  buildFlashDeck();
  renderFlashCard();
})();
</script>
